<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduPulse Hub | Admin Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-base: #06090f;
            --bg-surface: #0d131f;
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.2);
            --accent-teal: #14b8a6;
            --accent-rose: #f43f5e;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --radius-md: 12px;
            --radius-lg: 18px;
            --shadow-main: 0 20px 50px -10px rgba(0, 0, 0, 0.8);
            --font-sans: 'Plus Jakarta Sans', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font-sans);
            background: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            overflow: hidden;
        }
        .bg-animation {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background: 
                radial-gradient(circle at 20% 50%, var(--primary-glow) 0%, transparent 50%),
                radial-gradient(circle at 80% 50%, rgba(20, 184, 166, 0.1) 0%, transparent 50%);
        }
        .login-container {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 400px;
            box-shadow: var(--shadow-main);
            position: relative;
            z-index: 1;
            animation: slideUp 0.5s ease;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .logo-area {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .logo-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, var(--primary), var(--accent-teal));
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: #fff;
            margin-bottom: 0.8rem;
        }
        .login-container h2 {
            font-size: 1.2rem;
            margin-bottom: 0.3rem;
            text-align: center;
        }
        .login-container .subtitle {
            color: var(--text-sub);
            font-size: 0.8rem;
            text-align: center;
            margin-bottom: 1.8rem;
        }
        .form-group {
            margin-bottom: 1.2rem;
        }
        .form-group label {
            display: block;
            font-size: 0.78rem;
            font-weight: 600;
            margin-bottom: 0.4rem;
            color: var(--text-sub);
        }
        .input-wrapper {
            position: relative;
        }
        .input-wrapper i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-sub);
            font-size: 0.85rem;
        }
        .form-group input {
            width: 100%;
            padding: 0.7rem 1rem 0.7rem 2.5rem;
            background: var(--bg-base);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            color: var(--text-main);
            font-size: 0.88rem;
            outline: none;
            transition: all 0.2s;
            font-family: var(--font-sans);
        }
        .form-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }
        .form-group input.error {
            border-color: var(--accent-rose);
            animation: shake 0.4s;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .btn-login {
            width: 100%;
            padding: 0.75rem;
            background: linear-gradient(135deg, var(--primary), #4f46e5);
            color: #fff;
            border: none;
            border-radius: var(--radius-md);
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            margin-top: 0.5rem;
            transition: all 0.3s;
            font-family: var(--font-sans);
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px var(--primary-glow);
        }
        .btn-login:active {
            transform: translateY(0);
        }
        .error-msg {
            color: var(--accent-rose);
            font-size: 0.78rem;
            margin-top: 0.8rem;
            text-align: center;
            display: none;
            padding: 0.5rem;
            background: rgba(244, 63, 94, 0.1);
            border-radius: 8px;
        }
        .error-msg.show {
            display: block;
            animation: fadeIn 0.3s;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 1.5rem;
            color: var(--accent-teal);
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .credential-hint {
            margin-top: 1.5rem;
            padding: 0.8rem;
            background: rgba(99, 102, 241, 0.05);
            border: 1px dashed var(--border-subtle);
            border-radius: 8px;
            font-size: 0.7rem;
            color: var(--text-muted);
            text-align: center;
            line-height: 1.6;
        }
        .credential-hint strong {
            color: var(--accent-teal);
        }
    </style>
</head>
<body>
    <div class="bg-animation"></div>

    <div class="login-container">
        <div class="logo-area">
            <div class="logo-icon">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h2>Admin Login</h2>
            <p class="subtitle">EduPulse Hub Management Portal</p>
        </div>

        <div class="form-group">
            <label for="username">Username</label>
            <div class="input-wrapper">
                <i class="fa-solid fa-user"></i>
                <input type="text" id="username" placeholder="Enter admin username" autocomplete="off">
            </div>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <div class="input-wrapper">
                <i class="fa-solid fa-key"></i>
                <input type="password" id="password" placeholder="Enter password" autocomplete="off">
            </div>
        </div>

        <button class="btn-login" id="loginBtn">
            <i class="fa-solid fa-right-to-bracket"></i> &nbsp;Secure Login
        </button>

        <div class="error-msg" id="errorMsg"></div>

        <a href="index.html" class="back-link">
            <i class="fa-solid fa-arrow-left"></i> &nbsp;Back to Student Portal
        </a>

        <div class="credential-hint">
            <i class="fa-solid fa-info-circle"></i> &nbsp;Default credentials:<br>
            Username: <strong>admin</strong> | Password: <strong>edupulse2026</strong>
        </div>
    </div>

    <script>
        // Admin credentials (stored in localStorage for demo)
        const ADMIN_CREDENTIALS = {
            username: 'admin',
            password: 'edupulse2026'
        };

        const SESSION_DURATION = 2 * 60 * 60 * 1000; // 2 hours

        // Check if already logged in
        function checkExistingSession() {
            const auth = sessionStorage.getItem("edupulse_admin_auth");
            const loginTime = sessionStorage.getItem("edupulse_login_timestamp");
            
            if (auth === "true" && loginTime) {
                const elapsed = Date.now() - parseInt(loginTime);
                if (elapsed < SESSION_DURATION) {
                    window.location.href = "admin.html";
                    return true;
                } else {
                    // Session expired
                    sessionStorage.removeItem("edupulse_admin_auth");
                    sessionStorage.removeItem("edupulse_login_timestamp");
                }
            }
            return false;
        }

        // Don't check on login page itself
        if (window.location.pathname.includes('login.html')) {
            // Allow access to login page
        }

        document.getElementById('loginBtn').addEventListener('click', handleLogin);
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleLogin();
        });

        function handleLogin() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('errorMsg');
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');

            // Reset errors
            errorMsg.classList.remove('show');
            usernameInput.classList.remove('error');
            passwordInput.classList.remove('error');

            // Validation
            if (!username) {
                showError('Please enter username');
                usernameInput.classList.add('error');
                usernameInput.focus();
                return;
            }

            if (!password) {
                showError('Please enter password');
                passwordInput.classList.add('error');
                passwordInput.focus();
                return;
            }

            // Check credentials
            if (username === ADMIN_CREDENTIALS.username && password === ADMIN_CREDENTIALS.password) {
                // Success - Create session
                sessionStorage.setItem("edupulse_admin_auth", "true");
                sessionStorage.setItem("edupulse_login_timestamp", Date.now().toString());
                sessionStorage.setItem("edupulse_admin_username", username);
                
                // Redirect to admin panel
                window.location.href = "admin.html";
            } else {
                showError('❌ Invalid credentials. Please try again.');
                passwordInput.value = '';
                passwordInput.classList.add('error');
                passwordInput.focus();
            }
        }

        function showError(message) {
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.textContent = message;
            errorMsg.classList.add('show');
            
            // Auto hide after 4 seconds
            setTimeout(() => {
                errorMsg.classList.remove('show');
            }, 4000);
        }

        // Prevent going back to admin after logout
        window.addEventListener('pageshow', (event) => {
            if (event.persisted) {
                checkExistingSession();
            }
        });
    </script>
</body>
</html>
