<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduPulse Hub | Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-base: #080b11;
            --bg-surface: #0f1523;
            --bg-surface-elevated: #161e31;
            --bg-glass: rgba(15, 21, 35, 0.9);
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --primary-glow: rgba(99, 102, 241, 0.2);
            --accent-teal: #14b8a6;
            --accent-teal-glow: rgba(20, 184, 166, 0.15);
            --accent-rose: #f43f5e;
            --accent-gold: #f59e0b;
            --text-main: #f3f4f6;
            --text-sub: #9ca3af;
            --text-muted: #6b7280;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-active: rgba(99, 102, 241, 0.35);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 18px;
            --shadow-main: 0 16px 40px -10px rgba(0, 0, 0, 0.6);
            --font-sans: 'Plus Jakarta Sans', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        [data-theme="light"] {
            --bg-base: #f8fafc;
            --bg-surface: #ffffff;
            --bg-surface-elevated: #f1f5f9;
            --bg-glass: rgba(255, 255, 255, 0.92);
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --primary-glow: rgba(79, 70, 229, 0.12);
            --accent-teal: #0d9488;
            --accent-teal-glow: rgba(13, 148, 136, 0.12);
            --accent-rose: #e11d48;
            --accent-gold: #d97706;
            --text-main: #0f172a;
            --text-sub: #475569;
            --text-muted: #94a3b8;
            --border-subtle: rgba(15, 23, 42, 0.08);
            --border-active: rgba(79, 70, 229, 0.25);
            --shadow-main: 0 16px 40px -10px rgba(15, 23, 42, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-sans); }
        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            transition: background-color 0.3s, color 0.3s;
        }
        ::selection { background: var(--primary); color: #fff; }

        .bg-glow-layer {
            position: fixed; inset: 0; pointer-events: none; z-index: -1;
            background: radial-gradient(circle at 10% 10%, var(--primary-glow) 0%, transparent 40%),
                        radial-gradient(circle at 90% 90%, var(--accent-teal-glow) 0%, transparent 45%);
        }

        /* Header */
        header {
            background: var(--bg-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-subtle);
            padding: 0.8rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            flex-wrap: wrap;
            gap: 0.8rem;
        }
        .brand { display: flex; align-items: center; gap: 10px; }
        .brand i {
            font-size: 1rem; color: #fff;
            background: linear-gradient(135deg, var(--primary), var(--accent-teal));
            width: 34px; height: 34px; border-radius: var(--radius-sm);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 12px var(--primary-glow);
        }
        .brand-title { font-size: 1rem; font-weight: 800; letter-spacing: -0.5px; }
        .brand-tag { font-family: var(--font-mono); font-size: 0.55rem; color: var(--accent-teal); font-weight: 600; text-transform: uppercase; }

        .header-actions { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
        .icon-btn {
            background: var(--bg-surface); border: 1px solid var(--border-subtle);
            color: var(--text-sub); width: 36px; height: 36px; border-radius: var(--radius-md);
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            font-size: 0.85rem; transition: all 0.2s;
        }
        .icon-btn:hover { color: var(--text-main); border-color: var(--border-active); }
        .nav-btn {
            text-decoration: none; font-weight: 600; font-size: 0.78rem; display: flex; align-items: center; gap: 5px;
            padding: 0.5rem 0.8rem; border-radius: var(--radius-md); transition: all 0.2s; white-space: nowrap;
            color: var(--text-sub); border: 1px solid var(--border-subtle); background: var(--bg-surface);
        }
        .nav-btn:hover { color: var(--primary); border-color: var(--primary); }
        .logout-btn {
            background: rgba(244, 63, 94, 0.1); border: 1px solid rgba(244, 63, 94, 0.25);
            color: var(--accent-rose); cursor: pointer; font-weight: 700; padding: 0.5rem 0.8rem;
            border-radius: var(--radius-md); display: flex; align-items: center; gap: 5px; font-size: 0.78rem;
        }
        .logout-btn:hover { background: var(--accent-rose); color: #fff; }

        /* Main Layout */
        .admin-layout {
            max-width: 1320px; margin: 1.5rem auto; padding: 0 1.5rem 3rem;
            display: grid; grid-template-columns: 1.8fr 1.2fr; gap: 1.5rem;
        }
        @media (max-width: 1024px) { .admin-layout { grid-template-columns: 1fr; } }

        .panel {
            background: var(--bg-surface); border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg); padding: 1.5rem; box-shadow: var(--shadow-main);
        }
        .panel h2 {
            font-size: 1rem; font-weight: 700; margin-bottom: 1.2rem;
            border-bottom: 1px solid var(--border-subtle); padding-bottom: 0.8rem;
            display: flex; align-items: center; gap: 8px;
        }
        .panel h2 i { color: var(--primary); }

        /* Form Styles */
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.9rem; margin-bottom: 0.9rem; }
        .form-full { grid-column: span 2; }
        @media (max-width: 640px) { .form-row { grid-template-columns: 1fr; } .form-full { grid-column: span 1; } }

        label { display: block; font-size: 0.75rem; font-weight: 600; color: var(--text-sub); margin-bottom: 0.3rem; }
        input, select, textarea {
            width: 100%; padding: 0.65rem 0.9rem; background: var(--bg-surface-elevated);
            border: 1px solid var(--border-subtle); border-radius: var(--radius-sm);
            color: var(--text-main); outline: none; font-size: 0.82rem; transition: all 0.2s;
        }
        input:focus, select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow); }
        textarea { resize: vertical; min-height: 80px; }

        .source-toggle { display: flex; gap: 0.5rem; margin-bottom: 0.8rem; }
        .toggle-btn {
            flex: 1; padding: 0.5rem; border-radius: var(--radius-sm); border: 1px solid var(--border-subtle);
            background: var(--bg-surface-elevated); color: var(--text-sub); font-weight: 600;
            font-size: 0.75rem; cursor: pointer; transition: all 0.2s; text-align: center;
        }
        .toggle-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

        .btn-submit {
            width: 100%; padding: 0.75rem; background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: #fff; border: none; border-radius: var(--radius-md); font-weight: 700;
            cursor: pointer; font-size: 0.85rem; margin-top: 0.8rem; transition: all 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 6px;
        }
        .btn-submit:hover { transform: translateY(-1px); box-shadow: 0 8px 20px var(--primary-glow); }
        .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        /* Stats */
        .stats-row { display: flex; gap: 0.6rem; margin-bottom: 1rem; flex-wrap: wrap; }
        .stat-box {
            flex: 1; min-width: 80px; background: var(--bg-surface-elevated);
            border: 1px solid var(--border-subtle); border-radius: var(--radius-sm);
            padding: 0.7rem; text-align: center;
        }
        .stat-box .number { font-size: 1.3rem; font-weight: 800; color: var(--primary); }
        .stat-box .label { font-size: 0.6rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600; margin-top: 2px; }

        /* Material List */
        .search-box { position: relative; margin-bottom: 0.8rem; }
        .search-box input { padding-left: 2.2rem; font-size: 0.78rem; }
        .search-box i { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 0.8rem; }

        .material-item {
            display: flex; justify-content: space-between; align-items: center; gap: 0.8rem;
            background: var(--bg-surface-elevated); border: 1px solid var(--border-subtle);
            padding: 0.8rem 0.9rem; border-radius: var(--radius-sm); margin-bottom: 0.5rem;
            border-left: 3px solid var(--accent-teal); transition: all 0.2s;
        }
        .material-item:hover { border-left-color: var(--primary); }
        .material-info .mat-title { font-weight: 700; font-size: 0.82rem; color: var(--text-main); }
        .material-info .mat-meta { font-size: 0.68rem; color: var(--text-sub); margin-top: 2px; font-family: var(--font-mono); }
        .delete-btn {
            color: var(--accent-rose); background: rgba(244, 63, 94, 0.1);
            border: none; padding: 0.4rem 0.6rem; border-radius: var(--radius-sm);
            cursor: pointer; font-size: 0.75rem; transition: all 0.2s; flex-shrink: 0;
        }
        .delete-btn:hover { background: var(--accent-rose); color: #fff; }
        .empty-state { text-align: center; padding: 2rem; color: var(--text-muted); font-size: 0.82rem; }

        /* Toast */
        .toast {
            position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 9999;
            padding: 0.7rem 1.2rem; border-radius: var(--radius-md); font-weight: 600;
            font-size: 0.82rem; color: #fff; display: none; animation: slideIn 0.3s;
            box-shadow: var(--shadow-main); max-width: 350px;
        }
        .toast.success { background: var(--accent-teal); }
        .toast.error { background: var(--accent-rose); }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    </style>
</head>
<body>
<div class="bg-glow-layer"></div>

<header>
    <div class="brand">
        <i class="fa-solid fa-shield-halved"></i>
        <div>
            <div class="brand-title">EduPulse Admin</div>
            <div class="brand-tag">Management Console</div>
        </div>
    </div>
    
    <div class="header-actions">
        <button class="icon-btn" id="themeToggle" title="Toggle Theme">
            <i class="fa-solid fa-sun"></i>
        </button>
        <a href="index.html" class="nav-btn" target="_blank">
            <i class="fa-solid fa-globe"></i> View Site
        </a>
        <button class="logout-btn" id="logoutBtn">
            <i class="fa-solid fa-right-from-bracket"></i> Logout
        </button>
    </div>
</header>

<div class="admin-layout">
    <!-- Left: Add Material Form -->
    <div class="panel">
        <h2><i class="fa-solid fa-file-circle-plus"></i> Add New Resource</h2>
        
        <div class="form-row">
            <div class="form-full">
                <label>Resource Title *</label>
                <input type="text" id="title" placeholder="e.g., BA 2nd Year Political Science Notes">
            </div>
        </div>
        
        <div class="form-row">
            <div>
                <label>Category *</label>
                <select id="type">
                    <option value="Syllabus">Syllabus</option>
                    <option value="Notes" selected>Notes</option>
                    <option value="PYQ">PYQ Paper</option>
                    <option value="Model Paper">Model Paper</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div>
                <label>Admin Name *</label>
                <input type="text" id="adminName" placeholder="Dr. Sharma" value="Admin">
            </div>
        </div>

        <div class="form-row">
            <div>
                <label>Subject *</label>
                <select id="subject">
                    <option value="">-- Select Subject --</option>
                    <option value="Comparative Govt. & Politics (POLS 201)">Comparative Govt. & Politics (POLS 201)</option>
                    <option value="International Relations (POLS 202)">International Relations (POLS 202)</option>
                    <option value="Hindi Gadya Sahitya (HIND 202)">Hindi Gadya Sahitya (HIND 202)</option>
                    <option value="English Compulsory (ENG CE 201)">English Compulsory (ENG CE 201)</option>
                    <option value="Sanskrit Grammar (SKT-DSC-203)">Sanskrit Grammar (SKT-DSC-203)</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div>
                <label>Department *</label>
                <select id="branch">
                    <option value="">-- Select Department --</option>
                    <option value="Political Science">Political Science</option>
                    <option value="Hindi">Hindi</option>
                    <option value="English">English</option>
                    <option value="Sanskrit">Sanskrit</option>
                    <option value="Other">Other</option>
                </select>
            </div>
        </div>

        <div class="form-row">
            <div>
                <label>Academic Year</label>
                <select id="year">
                    <option value="">-- Select Year --</option>
                    <option value="BA 1st Year">BA 1st Year</option>
                    <option value="BA 2nd Year">BA 2nd Year</option>
                    <option value="BA 3rd Year">BA 3rd Year</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div>
                <label>Session *</label>
                <select id="semester">
                    <option value="">-- Select Session --</option>
                    <option value="2022-2023">2022-2023</option>
                    <option value="2023-2024">2023-2024</option>
                    <option value="2024-2025">2024-2025</option>
                    <option value="2025-2026">2025-2026</option>
                    <option value="2026-2027">2026-2027</option>
                </select>
            </div>
        </div>

        <div class="form-row">
            <div class="form-full">
                <label>Description</label>
                <textarea id="desc" placeholder="Brief description of the resource..."></textarea>
            </div>
        </div>

        <div class="form-row">
            <div class="form-full">
                <label>PDF Source</label>
                <div class="source-toggle">
                    <button class="toggle-btn active" id="tabLink">🔗 PDF URL</button>
                    <button class="toggle-btn" id="tabUpload">📁 Upload PDF</button>
                </div>
                <div id="linkField">
                    <input type="url" id="pdfLink" placeholder="https://example.com/document.pdf">
                </div>
                <div id="uploadField" style="display:none;">
                    <input type="file" id="pdfFile" accept="application/pdf" style="padding:0.5rem;">
                    <small style="color:var(--text-muted);font-size:0.7rem;">Max size: 2.5MB</small>
                </div>
            </div>
        </div>

        <button class="btn-submit" id="publishBtn">
            <i class="fa-solid fa-cloud-arrow-up"></i> Publish Resource
        </button>
    </div>

    <!-- Right: Manage Materials -->
    <div class="panel">
        <h2><i class="fa-solid fa-list-check"></i> Manage Resources</h2>
        
        <div class="stats-row">
            <div class="stat-box">
                <div class="number" id="totalCount">0</div>
                <div class="label">Total</div>
            </div>
            <div class="stat-box">
                <div class="number" id="notesCount">0</div>
                <div class="label">Notes</div>
            </div>
            <div class="stat-box">
                <div class="number" id="pyqCount">0</div>
                <div class="label">PYQs</div>
            </div>
        </div>

        <div class="search-box">
            <i class="fa-solid fa-search"></i>
            <input type="text" id="searchMaterials" placeholder="Search materials...">
        </div>

        <div id="materialsList">
            <div class="empty-state">
                <i class="fa-solid fa-inbox" style="font-size:2rem;display:block;margin-bottom:0.5rem;"></i>
                No materials added yet
            </div>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ==================== SESSION CHECK ====================
const SESSION_DURATION = 2 * 60 * 60 * 1000; // 2 hours

function checkAuth() {
    const auth = sessionStorage.getItem("edupulse_admin_auth");
    const loginTime = sessionStorage.getItem("edupulse_login_timestamp");
    
    if (!auth || auth !== "true") {
        window.location.href = "login.html";
        return false;
    }
    
    if (loginTime) {
        const elapsed = Date.now() - parseInt(loginTime);
        if (elapsed > SESSION_DURATION) {
            sessionStorage.clear();
            alert("Session expired. Please login again.");
            window.location.href = "login.html";
            return false;
        }
    }
    
    return true;
}

if (!checkAuth()) {
    throw new Error("Authentication failed");
}

// Refresh session timestamp on activity
document.addEventListener('click', () => {
    sessionStorage.setItem("edupulse_login_timestamp", Date.now().toString());
});

// ==================== DATA MANAGEMENT ====================
const DB_KEY = 'edupulse_materials_db';
let materials = [];

function loadMaterials() {
    try {
        const data = localStorage.getItem(DB_KEY);
        materials = data ? JSON.parse(data) : [];
        return materials;
    } catch (e) {
        console.error("Failed to load materials:", e);
        materials = [];
        return [];
    }
}

function saveMaterials() {
    try {
        localStorage.setItem(DB_KEY, JSON.stringify(materials));
        return true;
    } catch (e) {
        showToast('Storage full! Please delete some items.', 'error');
        return false;
    }
}

// ==================== UI FUNCTIONS ====================
function showToast(message, type = 'success') {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.className = `toast ${type}`;
    toast.style.display = 'block';
    
    setTimeout(() => {
        toast.style.display = 'none';
    }, 3000);
}

function updateStats() {
    document.getElementById('totalCount').textContent = materials.length;
    document.getElementById('notesCount').textContent = materials.filter(m => m.type === 'Notes').length;
    document.getElementById('pyqCount').textContent = materials.filter(m => m.type === 'PYQ').length;
}

function renderMaterialsList(filter = '') {
    const container = document.getElementById('materialsList');
    const searchTerm = filter.toLowerCase();
    
    const filtered = materials.filter(m => 
        !searchTerm || 
        m.title.toLowerCase().includes(searchTerm) ||
        m.subject.toLowerCase().includes(searchTerm) ||
        m.branch.toLowerCase().includes(searchTerm)
    ).sort((a, b) => b.timestamp - a.timestamp);
    
    if (filtered.length === 0) {
        container.innerHTML = `
            <div class="empty-state">
                <i class="fa-solid fa-inbox" style="font-size:2rem;display:block;margin-bottom:0.5rem;"></i>
                ${searchTerm ? 'No matching materials found' : 'No materials added yet'}
            </div>`;
        return;
    }
    
    container.innerHTML = filtered.map(m => `
        <div class="material-item">
            <div class="material-info">
                <div class="mat-title">${escapeHtml(m.title)}</div>
                <div class="mat-meta">${m.type} • ${m.subject} • ${m.semester || 'N/A'}</div>
            </div>
            <button class="delete-btn" onclick="deleteMaterial(${m.id})" title="Delete">
                <i class="fa-solid fa-trash"></i>
            </button>
        </div>
    `).join('');
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function deleteMaterial(id) {
    if (!confirm('Are you sure you want to delete this resource? This cannot be undone.')) {
        return;
    }
    
    materials = materials.filter(m => m.id !== id);
    if (saveMaterials()) {
        updateStats();
        renderMaterialsList(document.getElementById('searchMaterials').value);
        showToast('Resource deleted successfully!');
    }
}

// ==================== FORM HANDLING ====================
let pdfBase64 = '';
let sourceMode = 'link';

document.getElementById('tabLink').addEventListener('click', function() {
    sourceMode = 'link';
    this.classList.add('active');
    document.getElementById('tabUpload').classList.remove('active');
    document.getElementById('linkField').style.display = 'block';
    document.getElementById('uploadField').style.display = 'none';
});

document.getElementById('tabUpload').addEventListener('click', function() {
    sourceMode = 'upload';
    this.classList.add('active');
    document.getElementById('tabLink').classList.remove('active');
    document.getElementById('uploadField').style.display = 'block';
    document.getElementById('linkField').style.display = 'none';
});

document.getElementById('pdfFile').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    
    if (file.type !== 'application/pdf') {
        showToast('Please select a valid PDF file!', 'error');
        this.value = '';
        return;
    }
    
    if (file.size > 2.5 * 1024 * 1024) {
        showToast('File too large! Maximum size is 2.5MB.', 'error');
        this.value = '';
        return;
    }
    
    const reader = new FileReader();
    reader.onload = function(ev) {
        pdfBase64 = ev.target.result;
        showToast('PDF loaded successfully!');
    };
    reader.onerror = function() {
        showToast('Failed to read file!', 'error');
    };
    reader.readAsDataURL(file);
});

document.getElementById('publishBtn').addEventListener('click', function() {
    // Get form values
    const title = document.getElementById('title').value.trim();
    const type = document.getElementById('type').value;
    const adminName = document.getElementById('adminName').value.trim();
    const subject = document.getElementById('subject').value;
    const branch = document.getElementById('branch').value;
    const year = document.getElementById('year').value;
    const semester = document.getElementById('semester').value;
    const desc = document.getElementById('desc').value.trim();
    
    // Validation
    if (!title) return showToast('Please enter a resource title!', 'error');
    if (!adminName) return showToast('Please enter admin name!', 'error');
    if (!subject) return showToast('Please select a subject!', 'error');
    if (!branch) return showToast('Please select a department!', 'error');
    if (!semester) return showToast('Please select a session!', 'error');
    
    // Get PDF source
    let pdfUrl = '';
    if (sourceMode === 'link') {
        pdfUrl = document.getElementById('pdfLink').value.trim();
    } else {
        pdfUrl = pdfBase64;
    }
    
    // If no PDF provided, use a placeholder
    if (!pdfUrl) {
        pdfUrl = '';
    }
    
    // Create material object
    const material = {
        id: Date.now(),
        title,
        type,
        adminName,
        subject,
        branch,
        year,
        semester,
        desc,
        pdfData: pdfUrl,
        pdfUrl: pdfUrl,
        timestamp: Date.now()
    };
    
    // Add to array
    materials.unshift(material);
    
    // Save
    if (saveMaterials()) {
        // Reset form
        document.getElementById('title').value = '';
        document.getElementById('desc').value = '';
        document.getElementById('pdfLink').value = '';
        document.getElementById('pdfFile').value = '';
        pdfBase64 = '';
        
        // Update UI
        updateStats();
        renderMaterialsList(document.getElementById('searchMaterials').value);
        showToast('✅ Resource published successfully!');
    }
});

// Search functionality
document.getElementById('searchMaterials').addEventListener('input', function(e) {
    renderMaterialsList(e.target.value);
});

// ==================== THEME TOGGLE ====================
document.getElementById('themeToggle').addEventListener('click', function() {
    const html = document.documentElement;
    const isDark = html.getAttribute('data-theme') === 'dark';
    html.setAttribute('data-theme', isDark ? 'light' : 'dark');
    this.innerHTML = isDark ? '<i class="fa-solid fa-moon"></i>' : '<i class="fa-solid fa-sun"></i>';
    localStorage.setItem('edupulse_theme', isDark ? 'light' : 'dark');
});

// ==================== LOGOUT ====================
document.getElementById('logoutBtn').addEventListener('click', function() {
    if (confirm('Are you sure you want to logout?')) {
        sessionStorage.clear();
        window.location.href = 'login.html';
    }
});

// ==================== INITIALIZATION ====================
function init() {
    // Check auth
    if (!checkAuth()) return;
    
    // Load theme
    const savedTheme = localStorage.getItem('edupulse_theme');
    if (savedTheme === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
        document.getElementById('themeToggle').innerHTML = '<i class="fa-solid fa-moon"></i>';
    }
    
    // Load data
    loadMaterials();
    updateStats();
    renderMaterialsList();
    
    console.log('✅ Admin Dashboard Ready -', materials.length, 'materials loaded');
}

init();
</script>
</body>
</html>
